[project]
name = "clickup-mcp-server"
version = "0.1.0"
description = "Comprehensive ClickUp MCP server for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.setuptools]
py-modules = ["config", "server", "api_client", "cache"]

[tool.setuptools.packages.find]
include = ["tools*", "utils*"]
